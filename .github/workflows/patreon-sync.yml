# Patreon → patrons.json の定期同期（公開用リポジトリの .github/workflows/ へ置く）
# 必要な secret: PATREON_ACCESS_TOKEN（Patreon の Creator's Access Token）
name: Sync Patreon patrons

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 分ごと
  workflow_dispatch: {}       # 手動実行（mapping.json 更新後すぐ反映したいとき）
  push:
    paths:
      - mapping.json          # 紐付け表を編集したら即同期

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 🔑 サードパーティ Action はコミット SHA でピン留め（2026-09-01 レビュー指摘 #6・
      #    タグは移動できるため）。SHA は actions/checkout と actions/setup-node の
      #    v4 メジャータグが指すコミット（2026-09-01 に GitHub API で取得）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Sync patrons from Patreon
        run: node sync_patreon.mjs
        env:
          PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "patreon-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/patrons.json
          git diff --cached --quiet || git commit -m "chore: sync patrons from Patreon"
          git push
